name: Ingest ACLED Data

on:
  repository_dispatch:
    types: [ingest]
  workflow_dispatch:

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
  R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-dotenv google-genai pydantic openpyxl boto3
      - run: python clean_and_structure_data.py --from-r2 --upload-to-r2
      - name: Commit and push data file
        run: |
          git config user.name "Pipeline Bot"
          git config user.email "jakintayo@thepinnacleng.com"
          git add tracker-app/public/data/incidents.json
          git diff --cached --quiet || git commit -m "chore: update dashboard data file"
          git pull --rebase
          git push
